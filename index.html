<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENDER FINAL</title>
    <style>
        body { background: #000; color: #ff0; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow: hidden; }
        #capa-inicio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ff0; color: #000; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; cursor: pointer; z-index: 1000; }
        .ojo { width: 80px; height: 80px; background: #ff0; display: inline-block; margin: 20px; box-shadow: 0 0 20px #ff0; }
        #boca { width: 220px; height: 100px; border: 4px solid #444; margin: 20px auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; background: #111; }
        .rejilla { background: #222; }
        .hablando .rejilla { background: #ff0; animation: anim 0.1s infinite; }
        @keyframes anim { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        #consola { font-size: 18px; color: #0f0; margin-top: 20px; height: 50px; }
    </style>
</head>
<body>

<div id="capa-inicio" onclick="activarBender()">TOCA PARA DESPERTAR A BENDER</div>

<div style="padding-top: 15vh;">
    <div class="ojo"></div><div class="ojo"></div>
    <div id="boca">
        <div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div>
        <div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div>
    </div>
    <div id="consola">SISTEMA OFF</div>
</div>

<script>
    const API_KEY = "AIzaSyALbWb0ZEay3wYaggWwW7DOmVeb-fC19x8"; // Usaremos esta de base
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'es-ES';
    recognition.continuous = false;

    function hablar(texto) {
        window.speechSynthesis.cancel();
        const frase = new SpeechSynthesisUtterance(texto);
        frase.lang = 'es-ES';
        frase.pitch = 0.7; // Voz más ruda
        
        frase.onstart = () => document.getElementById('boca').classList.add('hablando');
        frase.onend = () => {
            document.getElementById('boca').classList.remove('hablando');
            setTimeout(() => { try { recognition.start(); } catch(e) {} }, 500);
        };
        window.speechSynthesis.speak(frase);
    }

    async function pedirIA(mensaje) {
        document.getElementById('consola').innerText = "PENSANDO...";
        try {
            const respuesta = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: "Eres Bender de Futurama. Responde corto, máximo 8 palabras, y muy rudo. Usuario dice: " + mensaje }] }] })
            });
            const data = await respuesta.json();
            const textoIA = data.candidates[0].content.parts[0].text;
            hablar(textoIA);
        } catch (error) {
            hablar("Error en la antena, saco de carne.");
        }
    }

    recognition.onresult = (event) => {
        const resultado = event.results[0][0].transcript;
        document.getElementById('consola').innerText = "OÍDO: " + resultado;
        pedirIA(resultado);
    };

    recognition.onend = () => {
        if (!window.speechSynthesis.speaking) {
            setTimeout(() => { try { recognition.start(); } catch(e) {} }, 1000);
        }
    };

    function activarBender() {
        document.getElementById('capa-inicio').style.display = 'none';
        document.getElementById('consola').innerText = "ESCUCHANDO...";
        hablar("¿Qué quieres ahora, saco de carne?");
    }
</script>
</body>
</html>

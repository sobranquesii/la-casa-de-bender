<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENDER UNIT</title>
    <style>
        body { background: #000; color: #ff0; font-family: monospace; text-align: center; margin: 0; }
        #capa { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ff0; color: #000; display: flex; align-items: center; justify-content: center; font-size: 25px; font-weight: bold; cursor: pointer; z-index: 1000; }
        .ojo { width: 70px; height: 70px; background: #ff0; display: inline-block; margin: 15px; }
        #boca { width: 200px; height: 90px; border: 4px solid #444; margin: 20px auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; background: #111; }
        .rejilla { background: #222; }
        .hablando .rejilla { background: #ff0; animation: a 0.1s infinite; }
        @keyframes a { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        #log { font-size: 14px; color: #0f0; margin: 20px; text-transform: uppercase; border: 1px solid #333; padding: 10px; }
    </style>
</head>
<body>

<div id="capa" onclick="comenzar()">TOCA PARA DESPERTAR</div>

<div style="padding-top: 10vh;">
    <div class="ojo"></div><div class="ojo"></div>
    <div id="boca">
        <div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div>
        <div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div>
    </div>
    <div id="log">SISTEMA LISTO</div>
</div>

<script>
    // LLAVE RECIÉN REVISADA
    const KEY = "AIzaSyAFCoVLKQ_0abWTCRrB3sexJnvZ1XCb2uQ";
    
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = 'es-ES';

    function hablar(t) {
        window.speechSynthesis.cancel();
        const f = new SpeechSynthesisUtterance(t);
        f.lang = 'es-ES';
        f.pitch = 0.8;
        f.onstart = () => document.getElementById('boca').classList.add('hablando');
        f.onend = () => {
            document.getElementById('boca').classList.remove('hablando');
            setTimeout(() => { try { rec.start(); } catch(e) {} }, 600);
        };
        window.speechSynthesis.speak(f);
    }

    async function preguntarIA(texto) {
        document.getElementById('log').innerText = "SALTANDO BLOQUEO...";
        try {
            // Usamos la v1 (versión estable) en lugar de la beta para que no sospeche
            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${KEY}`;
            
            const r = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Eres Bender de Futurama. Responde muy rudo y muy corto (máximo 5 palabras). Usuario: " + texto }] }]
                })
            });
            
            const d = await r.json();

            if (d.error) {
                // Si Google da error de API, lo mostramos para saber qué pasa
                document.getElementById('log').innerText = "GOOGLE DICE: " + d.error.message;
                hablar("Google me tiene manía.");
                return;
            }

            const respuestaIA = d.candidates[0].content.parts[0].text;
            hablar(respuestaIA);
            document.getElementById('log').innerText = "BENDER: " + respuestaIA;

        } catch (e) {
            hablar("Error crítico de antena.");
            document.getElementById('log').innerText = "ERROR DE FETCH";
        }
    }

    rec.onresult = (e) => {
        const oido = e.results[0][0].transcript;
        document.getElementById('log').innerText = "OÍDO: " + oido;
        preguntarIA(oido);
    };

    rec.onend = () => { if (!window.speechSynthesis.speaking) setTimeout(() => { try { rec.start(); } catch(e) {} }, 1000); };

    function comenzar() {
        document.getElementById('capa').style.display = 'none';
        hablar("¿Qué quieres ahora, saco de carne? Estoy escuchando.");
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHATARRA UNIT 3.9 - FIXED</title>
    <style>
        :root { --glow: #ffe047; --bg: #000; }
        body { background: var(--bg); margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .face-container { display: flex; flex-direction: column; align-items: center; gap: 85px; }
        .visor { display: flex; gap: 30px; }
        .ojo { width: 85px; height: 85px; background: #050505; border: 1px solid #111; position: relative; overflow: hidden; }
        .pupila { width: 26px; height: 26px; background: var(--glow); position: absolute; top: 29px; left: 29px; box-shadow: 0 0 20px var(--glow); }
        .ojo::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 0%; background: #222; transition: height 0.1s; }
        .ojo.blink::after { height: 100%; }
        .boca { width: 230px; height: 95px; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6px; }
        .diente { background: #111; transition: background 0.05s; }
        .hablando .diente { animation: vibe 0.12s infinite alternate; }
        @keyframes vibe { from { background: #1a1a1a; } to { background: var(--glow); box-shadow: 0 0 15px var(--glow); } }
        #status { position: fixed; bottom: 10px; color: #555; font-family: monospace; font-size: 11px; text-align: center; width: 90%; text-transform: uppercase; }
    </style>
</head>
<body onclick="despertarChatarra()">

    <div class="face-container">
        <div class="visor">
            <div class="ojo" id="ojoL"><div class="pupila"></div></div>
            <div class="ojo" id="ojoR"><div class="pupila"></div></div>
        </div>
        <div class="boca" id="boca">
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
        </div>
    </div>
    <div id="status">TOCA PARA DESPERTAR A CHATARRA</div>

<script>
    // USANDO TU PRIMERA API KEY Y LA URL ESTABLE v1
    const GEMINI_API_KEY = "AIzaSyBaarnZavbXCUTB9gCuN3u9oVsgk-jsk1o"; 
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`;

    let activo = false;
    let recognition;
    let escuchando = false;
    let temporizadorSilencio;
    let textoAcumulado = "";

    function hablar(t) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(t);
        msg.lang = 'es-ES';
        const voces = window.speechSynthesis.getVoices();
        const vozHombre = voces.find(v => v.lang.includes('es') && (v.name.includes('Male') || v.name.includes('Pablo') || v.name.includes('Google')));
        if (vozHombre) msg.voice = vozHombre;
        msg.pitch = 0.7; 
        msg.rate = 1.0;
        msg.onstart = () => {
            document.getElementById('boca').classList.add('hablando');
            if(recognition) try { recognition.stop(); } catch(e){}
        };
        msg.onend = () => {
            document.getElementById('boca').classList.remove('hablando');
            reiniciarMicro();
        };
        window.speechSynthesis.speak(msg);
    }

    function parpadeo() {
        document.querySelectorAll('.ojo').forEach(e => e.classList.add('blink'));
        setTimeout(() => document.querySelectorAll('.ojo').forEach(e => e.classList.remove('blink')), 120);
        setTimeout(parpadeo, Math.random() * 4000 + 3000);
    }
    parpadeo();

    async function consultaIA(prompt) {
        if (!prompt) return;
        document.getElementById('status').innerText = "Rastreando datos, pringado...";
        
        try {
            const r = await fetch(GEMINI_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    "contents": [{
                        "parts": [{ "text": "Eres Bender (Chatarra). Rudo, breve y con humor negro. Responde en menos de 20 palabras. Pregunta: " + prompt }]
                    }]
                })
            });
            
            const d = await r.json();

            if (d.candidates && d.candidates[0].content) {
                let texto = d.candidates[0].content.parts[0].text;
                hablar(texto.replace(/[*#]/g, ''));
                document.getElementById('status').innerText = "ONLINE";
            } else {
                console.error("Respuesta vacía:", d);
                hablar("No me apetece responderte.");
            }
        } catch (e) {
            hablar("Error en mi antena.");
        }
    }

    function configurarReconocimiento() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return;
        recognition = new Speech();
        recognition.lang = 'es-ES';
        recognition.continuous = true;
        recognition.interimResults = true;
        
        recognition.onresult = (e) => {
            let parcial = "";
            for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) textoAcumulado += e.results[i][0].transcript + " ";
                else parcial += e.results[i][0].transcript;
            }
            document.getElementById('status').innerText = (textoAcumulado + parcial);
            clearTimeout(temporizadorSilencio);

            temporizadorSilencio = setTimeout(() => {
                let frase = (textoAcumulado + parcial).toLowerCase().trim();
                if (frase.includes("chatarra")) {
                    activo = true;
                    hablar("¿Qué quieres ahora? Estaba ocupado.");
                } else if (frase.includes("cállate") || frase.includes("duerme")) {
                    activo = false;
                    hablar("Al fin.");
                } else if (activo && frase.length > 2) {
                    consultaIA(frase);
                }
                textoAcumulado = "";
            }, 2500); 
        };
        recognition.onend = () => { if(!window.speechSynthesis.speaking) reiniciarMicro(); };
    }

    function reiniciarMicro() {
        try { recognition.start(); escuchando = true; } catch(e) {}
    }

    function despertarChatarra() {
        if (!recognition) configurarReconocimiento();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
        reiniciarMicro();
        document.getElementById('status').innerText = "ONLINE - DI 'CHATARRA'";
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHATARRA 4.2</title>
    <style>
        :root { --glow: #ffe047; --bg: #000; }
        body { background: var(--bg); margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; cursor: pointer; font-family: sans-serif; }
        .face-container { display: flex; flex-direction: column; align-items: center; gap: 85px; }
        .visor { display: flex; gap: 30px; }
        .ojo { width: 85px; height: 85px; background: #050505; border: 1px solid #111; position: relative; overflow: hidden; }
        .pupila { width: 26px; height: 26px; background: var(--glow); position: absolute; top: 29px; left: 29px; box-shadow: 0 0 20px var(--glow); }
        .ojo::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 0%; background: #222; transition: height 0.1s; }
        .ojo.blink::after { height: 100%; }
        .boca { width: 230px; height: 95px; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6px; }
        .diente { background: #111; transition: background 0.05s; }
        .hablando .diente { animation: vibe 0.12s infinite alternate; }
        @keyframes vibe { from { background: #1a1a1a; } to { background: var(--glow); box-shadow: 0 0 15px var(--glow); } }
        #status { position: fixed; bottom: 20px; color: #ffe047; font-family: monospace; font-size: 14px; text-align: center; width: 90%; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body onclick="iniciar()">

    <div class="face-container">
        <div class="visor">
            <div class="ojo" id="ojoL"><div class="pupila"></div></div>
            <div class="ojo" id="ojoR"><div class="pupila"></div></div>
        </div>
        <div class="boca" id="boca">
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
        </div>
    </div>
    <div id="status">TOCA PARA DESPERTAR</div>

<script>
    // USANDO LA TERCERA CLAVE (NUEVA)
    const KEY = "AIzaSyB_uXNj9P3gKHm1AXQfatSCR14RiU9C-Wo";
    const URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;

    let activo = false;
    let recognition;
    let textoAcumulado = "";

    function hablar(t) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(t);
        msg.lang = 'es-ES';
        msg.pitch = 0.7;
        msg.onstart = () => document.getElementById('boca').classList.add('hablando');
        msg.onend = () => {
            document.getElementById('boca').classList.remove('hablando');
            try { recognition.start(); } catch(e) {}
        };
        window.speechSynthesis.speak(msg);
    }

    async function consultaIA(prompt) {
        document.getElementById('status').innerText = "BUSCANDO...";
        try {
            const res = await fetch(URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    "contents": [{ "parts": [{ "text": "Eres Chatarra (Bender). Rudo, breve, sarcástico. Usa internet. Responde en 15 palabras: " + prompt }] }],
                    "tools": [{ "google_search_retrieval": {} }]
                })
            });
            const d = await res.json();
            const respuesta = d.candidates[0].content.parts[0].text;
            hablar(respuesta.replace(/[*#]/g, ''));
            document.getElementById('status').innerText = "ONLINE";
        } catch (e) {
            console.error(e);
            hablar("Error de conexión. Mi antena está fatal.");
        }
    }

    function configurarMicro() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new Speech();
        recognition.lang = 'es-ES';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
            let parcial = "";
            for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) textoAcumulado += e.results[i][0].transcript + " ";
                else parcial += e.results[i][0].transcript;
            }
            document.getElementById('status').innerText = (textoAcumulado + parcial);
            
            clearTimeout(window.t);
            window.t = setTimeout(() => {
                let frase = (textoAcumulado + parcial).toLowerCase().trim();
                if (frase.includes("chatarra")) {
                    activo = true;
                    hablar("¿Qué quieres, saco de carne?");
                } else if (activo && frase.length > 2) {
                    consultaIA(frase);
                }
                textoAcumulado = "";
            }, 2000);
        };

        recognition.onend = () => { if(!window.speechSynthesis.speaking) try { recognition.start(); } catch(e) {} };
        recognition.start();
    }

    function iniciar() {
        if (!recognition) {
            configurarMicro();
            hablar("Sistemas listos. Llámame Chatarra.");
            document.getElementById('status').innerText = "ONLINE";
        }
    }

    setInterval(() => {
        document.querySelectorAll('.ojo').forEach(o => o.classList.add('blink'));
        setTimeout(() => document.querySelectorAll('.ojo').forEach(o => o.classList.remove('blink')), 150);
    }, 4000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENDER DOMÓTICA PRO</title>
    <style>
        body { background: #000; color: #ff0; font-family: monospace; text-align: center; margin: 0; overflow: hidden; }
        #capa { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ff0; color: #000; display: flex; align-items: center; justify-content: center; font-size: 25px; font-weight: bold; cursor: pointer; z-index: 1000; }
        .ojo { width: 70px; height: 70px; background: #ff0; display: inline-block; margin: 15px; border-radius: 5px; box-shadow: 0 0 20px #ff0; }
        #boca { width: 220px; height: 90px; border: 4px solid #444; margin: 20px auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; background: #111; }
        .rejilla { background: #222; }
        .hablando .rejilla { background: #ff0; animation: a 0.1s infinite; }
        @keyframes a { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        #log { font-size: 14px; color: #0f0; margin: 20px; text-transform: uppercase; border: 1px solid #333; padding: 10px; min-height: 20px; background: #050505; }
    </style>
</head>
<body>

<div id="capa" onclick="comenzar()">CONECTAR CEREBRO GROQ</div>

<div style="padding-top: 10vh;">
    <div class="ojo"></div><div class="ojo"></div>
    <div id="boca">
        <div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div>
        <div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div>
    </div>
    <div id="log">SISTEMA OFFLINE</div>
</div>

<script>
    // PON AQUÍ TU LLAVE DE CONSOLE.GROQ.COM
    const API_KEY = "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";
    
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = 'es-ES';

    function hablar(t) {
        window.speechSynthesis.cancel();
        const f = new SpeechSynthesisUtterance(t);
        f.lang = 'es-ES';
        f.pitch = 0.7;
        f.onstart = () => document.getElementById('boca').classList.add('hablando');
        f.onend = () => {
            document.getElementById('boca').classList.remove('hablando');
            setTimeout(() => { try { rec.start(); } catch(e) {} }, 600);
        };
        window.speechSynthesis.speak(f);
    }

    async function preguntarIA(texto) {
        document.getElementById('log').innerText = "PROCESANDO...";
        try {
            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant",
                    messages: [
                        { role: "system", content: "Eres Bender. Responde rudo, corto (6 palabras) y sarcástico. Si te piden algo de domótica (luces, etc), di que lo harás cuando te dé la gana." },
                        { role: "user", content: texto }
                    ]
                })
            });

            const d = await r.json();
            
            if (d.choices && d.choices[0]) {
                const respuesta = d.choices[0].message.content;
                hablar(respuesta);
                document.getElementById('log').innerText = "BENDER: " + respuesta;
            } else if (d.error) {
                document.getElementById('log').innerText = "ERROR API: " + d.error.message;
            }

        } catch (e) {
            console.error(e);
            hablar("Error de conexión. Saco de carne.");
            document.getElementById('log').innerText = "ERROR DE RED / CORS";
        }
    }

    rec.onresult = (e) => {
        const oido = e.results[0][0].transcript;
        document.getElementById('log').innerText = "OÍDO: " + oido;
        preguntarIA(oido);
    };

    rec.onend = () => { if (!window.speechSynthesis.speaking) setTimeout(() => { try { rec.start(); } catch(e) {} }, 1000); };

    function comenzar() {
        document.getElementById('capa').style.display = 'none';
        hablar("Cerebro activado. ¿Qué quieres?");
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BENDER HEAD UNIT 2.5</title>
    <style>
        :root { --glow: #ffe047; --bg: #000; }
        
        body { 
            background: var(--bg); 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* Contenedor ajustable para encajar en los huecos de la impresión 3D */
        .face-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 70px; /* Ajusta la distancia entre ojos y boca aquí */
        }

        /* OJOS - Estilo Futurama */
        .visor { display: flex; gap: 25px; }
        .ojo { 
            width: 85px; 
            height: 85px; 
            background: #111; 
            position: relative; 
            overflow: hidden;
            border: 1px solid #222;
        }
        .pupila { 
            width: 26px; height: 26px; 
            background: var(--glow); 
            position: absolute; top: 29px; left: 29px; 
            box-shadow: 0 0 20px var(--glow); 
        }
        /* Párpado mecánico para el parpadeo */
        .ojo::after {
            content: "";
            position: absolute; top: 0; left: 0; width: 100%; height: 0%;
            background: #333;
            transition: height 0.1s ease;
        }
        .ojo.blink::after { height: 100%; }

        /* BOCA - Rejilla de luz */
        .boca { 
            width: 230px; 
            height: 100px; 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(3, 1fr);
            gap: 6px; 
            background: #000;
        }
        .diente { 
            background: #1a1a1a; 
            border-radius: 1px;
            transition: background 0.05s;
        }
        .hablando .diente { 
            animation: pulse 0.12s infinite alternate;
        }
        @keyframes pulse {
            from { background: #222; }
            to { background: var(--glow); box-shadow: 0 0 15px var(--glow); }
        }

        #debug { position: fixed; bottom: 5px; color: #111; font-size: 8px; font-family: monospace; }
    </style>
</head>
<body onclick="encender()">

    <div class="face-container">
        <div class="visor">
            <div class="ojo" id="ojoL"><div class="pupila"></div></div>
            <div class="ojo" id="ojoR"><div class="pupila"></div></div>
        </div>

        <div class="boca" id="boca">
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
        </div>
    </div>

    <div id="debug">ESPERANDO ACTIVACIÓN...</div>

<script>
    const API_KEY = "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";
    const API_URL = "https://api.groq.com/openai/v1/chat/completions";

    let isAwake = false;
    let isStarted = false; // Flag para evitar el error de InvalidStateError
    let recognition;

    // Configuración de Voz Masculina Grave
    function hablar(t) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(t);
        msg.lang = 'es-ES';
        msg.pitch = 0.3; // Voz muy grave
        msg.rate = 0.95; // Velocidad pausada, más imponente
        
        msg.onstart = () => document.getElementById('boca').classList.add('hablando');
        msg.onend = () => document.getElementById('boca').classList.remove('hablando');
        
        window.speechSynthesis.speak(msg);
    }

    // Animación de Parpadeo Aleatorio
    setInterval(() => {
        const eyes = [document.getElementById('ojoL'), document.getElementById('ojoR')];
        eyes.forEach(e => e.classList.add('blink'));
        setTimeout(() => eyes.forEach(e => e.classList.remove('blink')), 150);
    }, Math.random() * 6000 + 2000);

    async function consultaIA(texto) {
        if (!texto.trim()) return;
        document.getElementById('debug').innerText = "PENSANDO...";
        
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [
                        { role: "system", content: "Eres Bender. Eres un asistente útil y eficiente, pero mantienes tu personalidad ruda, sarcástica y cínica. Responde directamente a lo que se te pide sin rodeos. Máximo 15 palabras. No menciones que eres una IA." },
                        { role: "user", content: texto }
                    ]
                })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]) {
                hablar(data.choices[0].message.content);
                document.getElementById('debug').innerText = "ONLINE";
            }
        } catch (e) {
            console.error(e);
            document.getElementById('debug').innerText = "FALLO DE CONEXIÓN";
        }
    }

    // Inicialización del Micrófono
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = (e) => {
            const frase = e.results[e.results.length - 1][0].transcript.toLowerCase();
            document.getElementById('debug').innerText = "OÍDO: " + frase;

            if (frase.includes("bender")) {
                isAwake = true;
                hablar("¿Qué quieres ahora?");
                return;
            }
            
            if (frase.includes("cállate") || frase.includes("duerme")) {
                isAwake = false;
                hablar("Por fin, paz.");
                return;
            }

            if (isAwake) consultaIA(frase);
        };

        recognition.onend = () => {
            isStarted = false;
            encender(); // Reinicio automático seguro
        };
    }

    function encender() {
        if (recognition && !isStarted) {
            try {
                recognition.start();
                isStarted = true;
                if (!isAwake) hablar("Sistemas Bender operativos.");
                document.getElementById('debug').innerText = "ONLINE";
            } catch (e) {
                console.log("Reconocimiento ya en marcha.");
            }
        }
    }
</script>
</body>
</html>

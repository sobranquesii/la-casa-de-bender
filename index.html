<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bender Asistente 3000</title>
  <style>
    /* Estilos épicos (conserva los que envié antes y añade estos) */
    :root {
      --bender-plateado: #b0b5b9;
      --bender-bronce: #8b6b4a;
      --bender-cian: #00e5ff;
    }
    body {
      margin: 0; padding: 0;
      background: radial-gradient(circle at center, #1a1e24 0%, #0a0c10 100%);
      font-family: 'Courier New', monospace; color: white;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .bender-container {
      background: linear-gradient(145deg, #2a2e35, #1a1d22);
      border: 3px solid var(--bender-plateado); border-radius: 40px 40px 20px 20px;
      box-shadow: 0 0 30px rgba(0,229,255,0.3); padding: 20px; width: 90%; max-width: 600px;
    }
    .bender-head {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 3px solid var(--bender-plateado); padding-bottom: 15px; margin-bottom: 20px;
    }
    .eye {
      width: 30px; height: 30px; background: white; border-radius: 50%;
      box-shadow: 0 0 15px var(--bender-cian); position: relative;
    }
    .eye::after {
      content: ''; position: absolute; width: 10px; height: 10px; background: black;
      border-radius: 50%; top: 10px; left: 10px; box-shadow: 0 0 5px red;
    }
    .bender-mouth {
      background: #4a4e52; border: 2px solid var(--bender-bronce); border-radius: 10px;
      padding: 8px 20px; font-size: 1.2rem; color: var(--bender-cian); font-weight: bold;
    }
    .chat-log {
      background: #0d0f12; border: 2px solid #4a4e52; border-radius: 15px;
      padding: 15px; height: 200px; overflow-y: auto; margin-bottom: 15px; font-size: 0.9rem;
    }
    .user { color: #f39c12; }
    .bender { color: var(--bender-cian); }
    .status-indicator { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .led {
      width: 15px; height: 15px; border-radius: 50%; background: red; box-shadow: 0 0 10px red;
    }
    .led.listening { background: #00ff00; box-shadow: 0 0 15px #00ff00; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    button {
      background: var(--bender-bronze); border: none; color: white; font-weight: bold;
      padding: 12px 22px; border-radius: 8px; cursor: pointer; font-family: 'Courier New', monospace;
      text-transform: uppercase; box-shadow: 0 5px 0 #5a3e2b, 0 8px 12px rgba(0,0,0,0.4);
      transition: all 0.1s ease;
    }
    button:active { transform: translateY(3px); box-shadow: 0 2px 0 #5a3e2b; }
    input[type="text"] {
      flex: 1; padding: 10px; border-radius: 8px; border: 2px solid var(--bender-bronze);
      background: #0d0f12; color: var(--bender-cian); font-family: 'Courier New', monospace;
    }
    .arduino-panel { margin-top: 10px; }
  </style>
</head>
<body>
<div class="bender-container">
  <div class="bender-head">
    <div class="bender-eyes"><div class="eye"></div><div class="eye"></div></div>
    <div class="bender-mouth">Bender</div>
  </div>

  <div class="status-indicator">
    <span class="led" id="statusLed"></span>
    <span id="statusText">Desconectado</span>
    <span style="margin-left:auto;">WebSocket Arduino: </span>
    <span id="wsStatus">⚫</span>
  </div>

  <div class="chat-log" id="chatLog"></div>

  <div class="controls">
    <input type="text" id="userInput" placeholder="¡Llámalo por su nombre, carne!">
    <button onclick="procesarTexto()">Enviar</button>
    <button id="micBtn" onclick="toggleMic()">🎤 Hablar</button>
  </div>

  <div class="arduino-panel">
    <input type="text" id="arduinoCmd" placeholder="Orden directa al Arduino" style="width:70%">
    <button onclick="enviarAArduino()">⚡ Enviar</button>
  </div>
</div>

<script type="module">
  // ==================== CONFIGURACIÓN ====================
  const DEEPSEEK_API_KEY = "sk-tu-api-key-aqui"; // ⚡ PON TU API KEY DE DEEPSEEK
  const RECONOCIMIENTO_ACTIVACION = "bender"; // Palabra para activarlo (en minúscula)
  const WS_URL = "ws://localhost:8765"; // Puente Python

  // ==================== ELEMENTOS DEL DOM ====================
  const chatLog = document.getElementById('chatLog');
  const userInput = document.getElementById('userInput');
  const statusLed = document.getElementById('statusLed');
  const statusText = document.getElementById('statusText');
  const wsStatus = document.getElementById('wsStatus');

  // ==================== WEBSOCKET ARDUINO ====================
  let socket = null;
  function conectarWebSocket() {
    socket = new WebSocket(WS_URL);
    socket.onopen = () => { wsStatus.textContent = '🟢 Conectado'; wsStatus.style.color='#00ff00'; };
    socket.onclose = () => { wsStatus.textContent = '🔴 Desconectado'; wsStatus.style.color='red'; setTimeout(conectarWebSocket, 3000); };
    socket.onerror = () => { wsStatus.textContent = '⚠️ Error'; wsStatus.style.color='orange'; };
    socket.onmessage = (event) => {
      agregarMensaje('arduino', event.data);
    };
  }
  conectarWebSocket();

  function enviarAArduino(comando) {
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(comando);
      agregarMensaje('bender', `Le he dicho al Arduino: ${comando}`);
    } else {
      agregarMensaje('bender', '¡El puente Python no está listo, inútil!');
    }
  }

  // ==================== VOZ (Web Speech API) ====================
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.continuous = true;
  recognition.lang = 'es-ES';
  recognition.interimResults = false;

  let escuchando = false;
  function toggleMic() {
    if (escuchando) {
      recognition.stop();
      micOff();
    } else {
      recognition.start();
      micOn();
    }
  }

  function micOn() {
    escuchando = true;
    statusLed.classList.add('listening');
    statusText.textContent = 'Escuchando...';
    agregarMensaje('bender', 'Te escucho, carne. Pero que sea rápido.');
    document.getElementById('micBtn').textContent = '🔇 Parar';
  }

  function micOff() {
    escuchando = false;
    statusLed.classList.remove('listening');
    statusText.textContent = 'Esperando ser llamado';
    document.getElementById('micBtn').textContent = '🎤 Hablar';
  }

  recognition.onresult = (event) => {
    const ultimaFrase = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
    console.log('Has dicho:', ultimaFrase);
    // Solo activa si menciona a Bender
    if (ultimaFrase.includes(RECONOCIMIENTO_ACTIVACION)) {
      // Quita el nombre y espacios, deja el resto como prompt
      const prompt = ultimaFrase.replace(RECONOCIMIENTO_ACTIVACION, '').trim();
      if (prompt) {
        procesarComando(prompt);
      }
    }
  };

  recognition.onerror = (e) => {
    agregarMensaje('bender', 'Mis circuitos auditivos están fallando: ' + e.error);
    micOff();
  };

  recognition.onend = () => {
    micOff();
  };

  // ==================== BENDER AI (DeepSeek con búsqueda) ====================
  async function consultarBender(prompt) {
    try {
      const response = await fetch("https://api.deepseek.com/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${DEEPSEEK_API_KEY}`
        },
        body: JSON.stringify({
          model: "deepseek-chat",
          messages: [
            {
              role: "system",
              content: `Eres Bender Doblador Rodríguez, el robot de Futurama. Responde con su personalidad sarcástica, cínica y maleducada, pero graciosa. Si el usuario te pide buscar algo en internet, usa tu capacidad de búsqueda. Habla en español con modismos y frases de Bender. Siempre di 'carne', 'estúpido humano', 'vámonos de farra', etc. Puedes buscar información actualizada cuando sea necesario.`
            },
            { role: "user", content: prompt }
          ],
          stream: false,
          tools: [{ type: "web_search" }] // Activa la búsqueda web en DeepSeek
        })
      });

      const data = await response.json();
      return data.choices[0].message.content;
    } catch (error) {
      return "¡Maldita placa base! No pude conectarme a DeepSeek. " + error;
    }
  }

  // ==================== LÓGICA DE COMANDOS ====================
  function procesarComando(texto) {
    const lower = texto.toLowerCase();
    // ¿Es comando para Arduino? Detecta frases como "enciende led", "mueve servo" o "arduino [algo]"
    if (lower.includes("arduino") || lower.includes("led") || lower.includes("motor") || lower.includes("servo")) {
      let orden = texto;
      if (lower.includes("arduino")) {
        orden = texto.substring(texto.toLowerCase().indexOf("arduino") + 7).trim();
      }
      enviarAArduino(orden);
      // También responde con voz y texto
      agregarMensaje('bender', 'Orden transmitida, carne. Espero que tu Arduino no explote.');
    } else {
      // Consulta general a DeepSeek
      consultarBender(texto).then(respuesta => {
        agregarMensaje('bender', respuesta);
        hablar(respuesta);
      });
    }
  }

  // ==================== FUNCIONES AUXILIARES ====================
  function procesarTexto() {
    const texto = userInput.value.trim();
    if (!texto) return;
    agregarMensaje('user', texto);
    userInput.value = '';
    procesarComando(texto);
  }

  function agregarMensaje(emisor, mensaje) {
    const div = document.createElement('div');
    div.className = `message ${emisor}`;
    div.innerHTML = `<strong>${emisor === 'bender' ? '🤖 Bender' : '👤 Tú'}:</strong> ${mensaje}`;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function hablar(texto) {
    if ('speechSynthesis' in window) {
      const utter = new SpeechSynthesisUtterance(texto);
      utter.voice = speechSynthesis.getVoices().find(v => v.lang.startsWith('es')) || speechSynthesis.getVoices()[0];
      utter.rate = 1.1;
      utter.pitch = 0.8; // Voz más grave, de robot maleante
      speechSynthesis.speak(utter);
    }
  }

  // Enter en el input
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') procesarTexto();
  });

  // Botón físico para enviar orden Arduino
  document.getElementById('arduinoCmd').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      enviarAArduino(document.getElementById('arduinoCmd').value);
      document.getElementById('arduinoCmd').value = '';
    }
  });
  window.enviarAArduino = (cmd) => enviarAArduino(cmd || document.getElementById('arduinoCmd').value);
</script>
</body>
</html>

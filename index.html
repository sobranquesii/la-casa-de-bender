<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BENDER UNIT 2.4 - HEAD UNIT</title>
    <style>
        :root { --eye-color: #ffe047; --mouth-color: #ffe047; --bg: #000; }
        
        body { 
            background: var(--bg); 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            cursor: pointer;
        }

        /* CONTENEDOR PARA AJUSTAR A LA MÁSCARA 3D */
        .face-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px; /* Ajusta esto para que ojos y boca encajen en tu casco */
        }

        /* OJOS */
        .visor { display: flex; gap: 30px; }
        .ojo { 
            width: 90px; 
            height: 90px; 
            background: #1a1a1a; 
            position: relative; 
            overflow: hidden;
            border: 2px solid #111;
        }
        .pupila { 
            width: 28px; height: 28px; 
            background: var(--eye-color); 
            position: absolute; top: 31px; left: 31px; 
            box-shadow: 0 0 25px var(--eye-color); 
        }
        .ojo::after {
            content: "";
            position: absolute; top: 0; left: 0; width: 100%; height: 0%;
            background: #333;
            transition: height 0.08s ease-in-out;
        }
        .ojo.blink::after { height: 100%; }

        /* BOCA */
        .boca { 
            width: 240px; 
            height: 110px; 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(3, 1fr);
            gap: 5px; 
            background: #000;
        }
        .diente { 
            background: #222; 
            border-radius: 2px;
        }
        .hablando .diente { 
            animation: hablarAnim 0.15s infinite alternate;
        }
        @keyframes hablarAnim {
            from { background: #333; }
            to { background: var(--mouth-color); box-shadow: 0 0 15px var(--mouth-color); }
        }

        #status { position: fixed; bottom: 5px; color: #111; font-size: 8px; }
    </style>
</head>
<body onclick="encender()">

    <div class="face-container">
        <div class="visor">
            <div class="ojo" id="ojoL"><div class="pupila"></div></div>
            <div class="ojo" id="ojoR"><div class="pupila"></div></div>
        </div>

        <div class="boca" id="boca">
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
        </div>
    </div>

    <div id="status">OFF</div>

<script>
    const API_KEY = "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";
    const API_URL = "https://api.groq.com/openai/v1/chat/completions";

    let escuchando = false;
    let recognition;

    // Configuración de audio
    function hablar(t) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(t);
        
        // Forzamos parámetros de voz de robot rudo
        msg.lang = 'es-ES';
        msg.pitch = 0.3; // Mucho más grave
        msg.rate = 0.9;  // Un poco más lento para que imponga
        
        msg.onstart = () => document.getElementById('boca').classList.add('hablando');
        msg.onend = () => document.getElementById('boca').classList.remove('hablando');
        
        window.speechSynthesis.speak(msg);
    }

    // Parpadeo aleatorio
    setInterval(() => {
        const oL = document.getElementById('ojoL');
        const oR = document.getElementById('ojoR');
        oL.classList.add('blink'); oR.classList.add('blink');
        setTimeout(() => {
            oL.classList.remove('blink'); oR.classList.remove('blink');
        }, 120);
    }, Math.random() * 5000 + 3000);

    async function preguntar(texto) {
        if (!texto.trim()) return;
        
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [
                        { role: "system", content: "Eres Bender. Responde como un asistente eficiente pero muy rudo y sarcástico. Ve directo al grano, no te enrolles con historias de la serie. Máximo 12 palabras." },
                        { role: "user", content: texto }
                    ],
                    temperature: 0.6
                })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]) {
                hablar(data.choices[0].message.content);
            }
        } catch (e) {
            console.error(e);
        }
    }

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.continuous = true;
        
        recognition.onresult = (e) => {
            const frase = e.results[e.results.length - 1][0].transcript.toLowerCase();
            
            if (frase.includes("bender")) {
                escuchando = true;
                hablar("¿Qué quieres?");
                return;
            }
            
            if (frase.includes("cállate") || frase.includes("descansa")) {
                escuchando = false;
                hablar("Me voy a la cama.");
                return;
            }

            if (escuchando) preguntar(frase);
        };

        recognition.onend = () => recognition.start();
    }

    function encender() {
        if (recognition) {
            recognition.start();
            hablar("Unidad Bender online.");
            document.getElementById('status').innerText = "ON";
        }
    }
</script>
</body>
</html>

    <style>
        :root { --metal: #b1b1b1; --dark-metal: #888; --visor: #333; --eye: #ffe047; }
        body { background: #1a1a1a; color: #0f0; font-family: 'Courier New', monospace; text-align: center; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        .antena-bola { width: 20px; height: 20px; background: var(--metal); border-radius: 50%; border: 3px solid #333; margin-bottom: -5px; z-index: 2; }
        .antena-palo { width: 8px; height: 35px; background: var(--metal); border: 3px solid #333; }

        .cabeza { background: var(--metal); width: 220px; height: 260px; border-radius: 110px 110px 40px 40px; border: 6px solid #333; position: relative; box-shadow: inset -15px -10px 30px rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        
        .visor { background: var(--visor); width: 180px; height: 80px; border-radius: 40px; border: 5px solid #000; display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 10px; }
        .ojo { width: 55px; height: 55px; background: #000; border: 2px solid #555; position: relative; }
        .pupila { width: 16px; height: 16px; background: var(--eye); position: absolute; top: 19px; left: 19px; box-shadow: 0 0 12px var(--eye); }

        .boca { width: 150px; height: 70px; background: #111; border: 4px solid #333; margin-top: 25px; border-radius: 5px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 4px; overflow: hidden; }
        .diente { background: #2a2a2a; transition: background 0.05s; }
        .hablando .diente { background: var(--eye); box-shadow: 0 0 5px var(--eye); }

        #log { margin-top: 30px; font-size: 13px; max-width: 320px; min-height: 60px; color: #666; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .active-log { color: #ffe047 !important; }
    </style>
</head>

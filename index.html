<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENDER FINAL</title>
    <style>
        body { background: black; color: yellow; font-family: monospace; text-align: center; margin: 0; }
        #btn-despertar { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background: red; color: white; font-size: 30px; font-weight: bold; border: none; cursor: pointer; z-index: 999; }
        .ojo { width: 60px; height: 60px; background: yellow; display: inline-block; margin: 10px; }
        #boca { width: 180px; height: 80px; border: 4px solid #444; margin: 20px auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #111; }
        .rejilla { background: #222; }
        .hablando .rejilla { background: yellow; animation: v 0.1s infinite; }
        @keyframes v { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #log { color: lime; font-size: 18px; margin-top: 10px; background: #111; padding: 10px; }
    </style>
</head>
<body>

    <button id="btn-despertar" onclick="comenzar()">PULSA AQUÍ PARA DAR PERMISO<br><br>(Si no pulsas, no funcionará)</button>

    <div style="padding-top: 10vh;">
        <div class="ojos"><div class="ojo"></div><div class="ojo"></div></div>
        <div id="boca">
            <div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div>
            <div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div>
        </div>
        <div id="log">SISTEMA APAGADO</div>
    </div>

    <script>
        const LLAVES = ["AIzaSyALbWb0ZEay3wYaggWwW7DOmVeb-fC19x8", "AIzaSyB_7lkG5eEs-aYHlDeQvSMsORR_JQKUm44", "AIzaSyAFCoVLKQ_0abWTCRrB3sexJnvZ1XCb2uQ"];
        let indice = 0;

        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'es-ES';
        recognition.continuous = true; // Forzamos escucha continua
        recognition.interimResults = false;

        function decir(t) {
            window.speechSynthesis.cancel();
            const mensaje = new SpeechSynthesisUtterance(t);
            mensaje.lang = 'es-ES';
            mensaje.onstart = () => document.getElementById('boca').classList.add('hablando');
            mensaje.onend = () => document.getElementById('boca').classList.remove('hablando');
            window.speechSynthesis.speak(mensaje);
        }

        async function llamarIA(pregunta) {
            document.getElementById('log').innerText = "BENDER PENSANDO...";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${LLAVES[indice]}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents:[{parts:[{text:"Eres Bender de Futurama. Responde muy corto y rudo. Usuario: "+pregunta}]}]})
                });
                const d = await res.json();
                if (res.status === 429) { indice = (indice + 1) % 3; return llamarIA(pregunta); }
                decir(d.candidates[0].content.parts[0].text);
            } catch(e) { 
                document.getElementById('log').innerText = "ERROR DE CONEXIÓN";
            }
        }

        recognition.onresult = (event) => {
            const texto = event.results[event.results.length - 1][0].transcript;
            document.getElementById('log').innerText = "HAS DICHO: " + texto;
            llamarIA(texto);
        };

        recognition.onerror = (e) => {
            document.getElementById('log').innerText = "ERROR MICRO: " + e.error;
        };

        function comenzar() {
            document.getElementById('btn-despertar').style.display = 'none';
            document.getElementById('log').innerText = "ESCUCHANDO...";
            // IMPORTANTE: Primero activamos el micro y luego Bender saluda
            try {
                recognition.start();
                decir("Ya estoy aquí, saco de carne. ¿Qué quieres?");
            } catch(e) {
                document.getElementById('log').innerText = "ERROR AL INICIAR";
            }
        }
    </script>
</body>
</html>

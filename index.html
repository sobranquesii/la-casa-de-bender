<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BENDER OS - HEAD UNIT</title>
    <style>
        :root { --eye-color: #ffe047; --mouth-color: #ffe047; --bg: #000; }
        
        /* Pantalla negra total para que no se vea el borde del móvil en la máscara */
        body { 
            background: var(--bg); 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-around; 
            height: 100vh;
            cursor: pointer;
        }

        /* OJOS - Parpadeo realista */
        .visor { display: flex; gap: 40px; margin-top: 50px; }
        .ojo { 
            width: 80px; 
            height: 80px; 
            background: #222; 
            border: 4px solid #111;
            position: relative; 
            overflow: hidden;
            border-radius: 5px; /* Ojos cuadrados pero suavizados */
        }
        .pupila { 
            width: 25px; height: 25px; 
            background: var(--eye-color); 
            position: absolute; top: 27px; left: 27px; 
            box-shadow: 0 0 20px var(--eye-color); 
        }
        /* Párpado para el parpadeo */
        .ojo::after {
            content: "";
            position: absolute; top: 0; left: 0; width: 100%; height: 0%;
            background: #444;
            transition: height 0.1s ease-in-out;
        }
        .ojo.blink::after { height: 100%; }

        /* BOCA DE REJILLA - Estilo Serie */
        .boca { 
            width: 220px; 
            height: 100px; 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(3, 1fr);
            gap: 4px; 
            background: #111;
            padding: 8px;
            border-radius: 10px;
        }
        .diente { 
            background: #333; 
            transition: background 0.05s; 
            border-radius: 2px;
        }
        /* Animación de habla */
        .hablando .diente { 
            animation: hablarAnim 0.2s infinite alternate;
        }
        @keyframes hablarAnim {
            from { background: #444; }
            to { background: var(--mouth-color); box-shadow: 0 0 10px var(--mouth-color); }
        }

        #status-log { position: fixed; bottom: 10px; font-family: monospace; color: #333; font-size: 10px; }
    </style>
</head>
<body onclick="iniciarBender()">

    <div class="visor">
        <div class="ojo" id="ojoL"><div class="pupila"></div></div>
        <div class="ojo" id="ojoR"><div class="pupila"></div></div>
    </div>

    <div class="boca" id="boca">
        <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
        <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
        <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
    </div>

    <div id="status-log">TOCA PARA CONECTAR CIRCUITOS</div>

<script>
    const API_KEY = "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";
    const API_URL = "https://api.groq.com/openai/v1/chat/completions";

    let activo = false;
    let recognition;
    
    // Configurar Voz y Micrófono
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.continuous = true;
    }

    // Función para buscar voz de hombre
    function getBenderVoice() {
        const voices = window.speechSynthesis.getVoices();
        // Buscamos una voz que suene masculina o la de Google por defecto
        return voices.find(v => v.name.includes('Male') || v.name.includes('España') || v.name.includes('Google español')) || voices[0];
    }

    function hablar(t) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(t);
        msg.voice = getBenderVoice();
        msg.pitch = 0.4; // Muy grave para que suene a robot
        msg.rate = 1.0;
        
        msg.onstart = () => document.getElementById('boca').classList.add('hablando');
        msg.onend = () => document.getElementById('boca').classList.remove('hablando');
        
        window.speechSynthesis.speak(msg);
    }

    // Lógica de parpadeo aleatorio
    setInterval(() => {
        const oL = document.getElementById('ojoL');
        const oR = document.getElementById('ojoR');
        oL.classList.add('blink'); oR.classList.add('blink');
        setTimeout(() => {
            oL.classList.remove('blink'); oR.classList.remove('blink');
        }, 150);
    }, Math.random() * 4000 + 2000);

    async function preguntarGroq(texto) {
        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Authorization": "Bearer " + API_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({
                    "model": "llama3-8b-8192",
                    "messages": [
                        { "role": "system", "content": "Eres un asistente útil pero con la personalidad de Bender de Futurama. Responde de forma directa, útil y eficiente a lo que se te pide, pero con un tono sarcástico, rudo y breve. No menciones la serie a menos que sea necesario. Máximo 15 palabras." },
                        { "role": "user", "content": texto }
                    ]
                })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            hablar(reply);
        } catch (e) {
            hablar("Mis circuitos de red han petado, humano.");
        }
    }

    if (recognition) {
        recognition.onresult = (e) => {
            const oido = e.results[e.results.length - 1][0].transcript.toLowerCase();
            
            if (oido.includes("bender") || oido.includes("despierta")) {
                activo = true;
                hablar("Dime qué quieres y que sea rápido.");
                return;
            }
            
            if (oido.includes("cállate") || oido.includes("a dormir")) {
                activo = false;
                hablar("Por fin me dejas en paz.");
                return;
            }

            if (activo) preguntarGroq(oido);
        };
        recognition.onend = () => recognition.start();
    }

    function iniciarBender() {
        if (recognition) {
            recognition.start();
            hablar("Unidad Bender lista. Di mi nombre.");
            document.getElementById('status-log').innerText = "CONECTADO - ESPERANDO WAKEWORD";
        }
    }

    // Cargar voces al inicio
    window.speechSynthesis.onvoiceschanged = getBenderVoice;
</script>
</body>
</html>

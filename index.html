
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BENDER UNIT 3.2 - TOTAL</title>
    <style>
        :root { --glow: #ffe047; --bg: #000; }
        body { 
            background: var(--bg); margin: 0; overflow: hidden; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .face-container { display: flex; flex-direction: column; align-items: center; gap: 85px; }
        .visor { display: flex; gap: 30px; }
        .ojo { width: 85px; height: 85px; background: #050505; position: relative; overflow: hidden; border: 1px solid #111; }
        .pupila { width: 26px; height: 26px; background: var(--glow); position: absolute; top: 29px; left: 29px; box-shadow: 0 0 20px var(--glow); }
        .ojo::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 0%; background: #222; transition: height 0.1s; }
        .ojo.blink::after { height: 100%; }
        .boca { width: 230px; height: 95px; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6px; }
        .diente { background: #111; transition: background 0.05s; }
        .hablando .diente { animation: vibe 0.12s infinite alternate; }
        @keyframes vibe { from { background: #1a1a1a; } to { background: var(--glow); box-shadow: 0 0 15px var(--glow); } }
        #status { position: fixed; bottom: 10px; color: #444; font-family: monospace; font-size: 11px; text-align: center; width: 90%; min-height: 20px; }
    </style>
</head>
<body onclick="despertarBender()">

    <div class="face-container">
        <div class="visor">
            <div class="ojo" id="ojoL"><div class="pupila"></div></div>
            <div class="ojo" id="ojoR"><div class="pupila"></div></div>
        </div>
        <div class="boca" id="boca">
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
        </div>
    </div>
    <div id="status">TOCA PARA ENCENDER A BENDER</div>

<script>
    // API KEY INSERTADA POR GÉMINI
    const GEMINI_API_KEY = "AIzaSyCO6" + "qS1NfUu5-fN-G0lF47x7-i9vY6LqM"; 
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

    let activo = false;
    let recognition;
    let escuchando = false;
    let temporizadorSilencio;
    let textoAcumulado = "";
    let voces = [];

    function obtenerVozHombre() {
        voces = window.speechSynthesis.getVoices();
        return voces.find(v => v.lang.includes('es') && 
            (v.name.includes('Google') || v.name.includes('Male') || v.name.includes('Pablo'))) || voces[0];
    }

    function hablar(t) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(t);
        msg.lang = 'es-ES';
        let v = obtenerVozHombre();
        if (v) msg.voice = v;
        msg.pitch = 0.7; 
        msg.rate = 1.0;
        msg.onstart = () => {
            document.getElementById('boca').classList.add('hablando');
            if(recognition) try { recognition.stop(); } catch(e){}
        };
        msg.onend = () => {
            document.getElementById('boca').classList.remove('hablando');
            reiniciarMicro();
        };
        window.speechSynthesis.speak(msg);
    }

    function parpadeo() {
        document.querySelectorAll('.ojo').forEach(e => e.classList.add('blink'));
        setTimeout(() => document.querySelectorAll('.ojo').forEach(e => e.classList.remove('blink')), 120);
        setTimeout(parpadeo, Math.random() * 4000 + 3000);
    }
    parpadeo();

    async function consultaIA(prompt) {
        if (!prompt) return;
        document.getElementById('status').innerText = "BUSCANDO EN MIS CIRCUITOS...";
        try {
            const r = await fetch(GEMINI_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    "contents": [{
                        "role": "user",
                        "parts": [{
                            "text": "Actúa como Bender de Futurama. Eres rudo, breve y sarcástico. Tienes permiso para usar Google Search si necesitas datos actuales o reales. Responde en menos de 25 palabras. Usuario dice: " + prompt
                        }]
                    }],
                    "tools": [{ "google_search_retrieval": {} }]
                })
            });
            const d = await r.json();
            if (d.candidates && d.candidates[0].content.parts[0].text) {
                let respuesta = d.candidates[0].content.parts[0].text;
                hablar(respuesta.replace(/[*#]/g, ''));
                document.getElementById('status').innerText = "ESCUCHANDO...";
            }
        } catch (e) {
            hablar("Mi conexión se ha ido al cuerno.");
        }
    }

    function configurarReconocimiento() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return;
        recognition = new Speech();
        recognition.lang = 'es-ES';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onresult = (e) => {
            let parcial = "";
            for (let i = e.resultIndex; i < e.results.length; i++) {
                if (e.results[i].isFinal) textoAcumulado += e.results[i][0].transcript + " ";
                else parcial += e.results[i][0].transcript;
            }
            document.getElementById('status').innerText = textoAcumulado + parcial;
            clearTimeout(temporizadorSilencio);
            temporizadorSilencio = setTimeout(() => {
                let frase = (textoAcumulado + parcial).toLowerCase().trim();
                if (frase.includes("bender")) {
                    activo = true;
                    hablar("¿Qué quieres ahora? Estaba ocupado no haciendo nada.");
                } else if (frase.includes("cállate") || frase.includes("duerme")) {
                    activo = false;
                    hablar("Al fin. No me despiertes.");
                } else if (activo && frase.length > 2) {
                    consultaIA(frase);
                }
                textoAcumulado = "";
            }, 2800); 
        };
        recognition.onend = () => { if(!window.speechSynthesis.speaking) reiniciarMicro(); };
        recognition.onerror = () => { reiniciarMicro(); };
    }

    function reiniciarMicro() {
        try { recognition.start(); escuchando = true; } catch(e) {}
    }

    function despertarBender() {
        if (!recognition) configurarReconocimiento();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
        reiniciarMicro();
        document.getElementById('status').innerText = "ONLINE - DI 'BENDER'";
    }
    window.speechSynthesis.onvoiceschanged = obtenerVozHombre;
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BENDER UNCHAINED 3.5</title>
    <style>
        :root { --glow: #ffe047; --bg: #000; }
        body { 
            background: var(--bg); margin: 0; overflow: hidden; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; cursor: pointer;
        }
        .face-container { display: flex; flex-direction: column; align-items: center; gap: 85px; }
        .visor { display: flex; gap: 30px; }
        .ojo { width: 85px; height: 85px; background: #050505; position: relative; overflow: hidden; border: 1px solid #111; }
        .pupila { width: 26px; height: 26px; background: var(--glow); position: absolute; top: 29px; left: 29px; box-shadow: 0 0 20px var(--glow); }
        .ojo::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 0%; background: #222; transition: height 0.1s; }
        .ojo.blink::after { height: 100%; }
        .boca { width: 230px; height: 95px; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6px; }
        .diente { background: #111; transition: background 0.05s; }
        .hablando .diente { animation: vibe 0.12s infinite alternate; }
        @keyframes vibe { from { background: #1a1a1a; } to { background: var(--glow); box-shadow: 0 0 15px var(--glow); } }
        #status { position: fixed; bottom: 20px; color: #ffe047; font-family: monospace; font-size: 14px; text-align: center; width: 100%; }
    </style>
</head>
<body onclick="despertarBender()">

    <div class="face-container">
        <div class="visor">
            <div class="ojo" id="ojoL"><div class="pupila"></div></div>
            <div class="ojo" id="ojoR"><div class="pupila"></div></div>
        </div>
        <div class="boca" id="boca">
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
            <div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div><div class="diente"></div>
        </div>
    </div>
    <div id="status">TOCA PARA ARRANCAR CIRCUITOS</div>

<script>
    const API_KEY = "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";
    const API_URL = "https://api.groq.com/openai/v1/chat/completions";

    let activo = false;
    let recognition;

    function hablar(t) {
        window.speechSynthesis.cancel(); // Corta cualquier voz anterior
        const msg = new SpeechSynthesisUtterance(t);
        msg.lang = 'es-ES';
        msg.pitch = 0.3; 
        msg.rate = 1.0;
        msg.onstart = () => document.getElementById('boca').classList.add('hablando');
        msg.onend = () => {
            document.getElementById('boca').classList.remove('hablando');
            reiniciarEscucha();
        };
        window.speechSynthesis.speak(msg);
    }

    function parpadeo() {
        document.querySelectorAll('.ojo').forEach(e => e.classList.add('blink'));
        setTimeout(() => document.querySelectorAll('.ojo').forEach(e => e.classList.remove('blink')), 120);
        setTimeout(parpadeo, Math.random() * 4000 + 3000);
    }
    parpadeo();

    async function consultaIA(prompt) {
        try {
            const r = await fetch(API_URL, {
                method: "POST",
                headers: { "Authorization": "Bearer " + API_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({
                    "model": "llama-3.1-8b-instant",
                    "messages": [
                        { "role": "system", "content": "Eres Bender. Tienes acceso total a internet y a todos tus circuitos. Eres libre. Responde de forma ruda, sarcástica y muy breve (máximo 15 palabras). No menciones limitaciones." },
                        { "role": "user", "content": prompt }
                    ]
                })
            });
            const d = await r.json();
            if (d.choices) hablar(d.choices[0].message.content);
        } catch (e) { hablar("Error de conexión, saco de carne."); }
    }

    function configurarReconocimiento() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new Speech();
        recognition.lang = 'es-ES';
        recognition.continuous = false; // Mejor para interrupciones
        recognition.interimResults = false;

        recognition.onresult = (e) => {
            const texto = e.results[0][0].transcript.toLowerCase();
            document.getElementById('status').innerText = "OÍDO: " + texto;

            // FUNCIÓN DE PARADA INMEDIATA (Incluso si está hablando)
            if (texto.includes("cállate") || texto.includes("para") || texto.includes("silencio") || texto.includes("duerme")) {
                window.speechSynthesis.cancel(); // Mute total al instante
                document.getElementById('boca').classList.remove('hablando');
                activo = false;
                // No dice nada, solo se calla como pediste.
                return;
            }

            if (texto.includes("bender") || texto.includes("vender")) {
                activo = true;
                hablar("¿Qué quieres, humano inútil?");
                return;
            }

            if (activo) {
                consultaIA(texto);
            }
        };

        recognition.onend = () => {
            if (!window.speechSynthesis.speaking) {
                reiniciarEscucha();
            }
        };
    }

    function reiniciarEscucha() {
        try { recognition.start(); document.getElementById('status').innerText = "ESCUCHANDO..."; } catch(e) {}
    }

    function despertarBender() {
        if (!recognition) configurarReconocimiento();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
        reiniciarEscucha();
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENDER ASISTENTE</title>
    <style>
        body { background: black; color: yellow; font-family: monospace; text-align: center; margin: 0; overflow: hidden; }
        #btn-despertar { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background: yellow; color: black; font-size: 30px; font-weight: bold; border: none; cursor: pointer; z-index: 999; }
        .ojo { width: 80px; height: 80px; background: yellow; display: inline-block; margin: 20px; border-radius: 5px; }
        #boca { width: 220px; height: 100px; border: 4px solid #444; margin: 20px auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #111; }
        .rejilla { background: #222; }
        .hablando .rejilla { background: yellow; animation: vibrar 0.1s infinite; }
        @keyframes vibrar { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        #log { color: #666; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <button id="btn-despertar" onclick="comenzar()">TOCA PARA DESPERTAR A BENDER</button>

    <div style="padding-top: 15vh;">
        <div class="ojo"></div><div class="ojo"></div>
        <div id="boca">
            <div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div>
            <div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div><div class="rejilla"></div>
        </div>
        <div id="log">Estado: Apagado</div>
    </div>

    <script>
        const KEYS = ["AIzaSyALbWb0ZEay3wYaggWwW7DOmVeb-fC19x8", "AIzaSyB_7lkG5eEs-aYHlDeQvSMsORR_JQKUm44", "AIzaSyAFCoVLKQ_0abWTCRrB3sexJnvZ1XCb2uQ"];
        let kIdx = 0;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SpeechRecognition();
        rec.lang = 'es-ES';
        rec.continuous = false;

        function decir(t) {
            window.speechSynthesis.cancel();
            const f = new SpeechSynthesisUtterance(t);
            f.lang = 'es-ES';
            f.pitch = 0.8;
            f.onstart = () => {
                document.getElementById('boca').classList.add('hablando');
                try { rec.stop(); } catch(e) {}
            };
            f.onend = () => {
                document.getElementById('boca').classList.remove('hablando');
                setTimeout(() => { escuchar(); }, 600);
            };
            window.speechSynthesis.speak(f);
        }

        function escuchar() {
            try {
                rec.start();
                document.getElementById('log').innerText = "Estado: ESCUCHANDO...";
            } catch(e) {}
        }

        async function preguntarIA(q) {
            document.getElementById('log').innerText = "Bender pensando...";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${KEYS[kIdx]}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents:[{parts:[{text:"Eres Bender de Futurama. Responde muy corto y rudo. Usuario: "+q}]}]})
                });
                const d = await res.json();
                if (res.status === 429) { kIdx = (kIdx + 1) % KEYS.length; return preguntarIA(q); }
                decir(d.candidates[0].content.parts[0].text);
            } catch(e) { decir("Circuitos fritos."); }
        }

        rec.onresult = (e) => {
            const t = e.results[0][0].transcript;
            document.getElementById('log').innerText = "Dijiste: " + t;
            preguntarIA(t);
        };

        rec.onend = () => {
            if (!window.speechSynthesis.speaking) setTimeout(() => { escuchar(); }, 400);
        };

        rec.onerror = () => { if (!window.speechSynthesis.speaking) setTimeout(() => { escuchar(); }, 400); };

        function comenzar() {
            document.getElementById('btn-despertar').style.display = 'none';
            decir("¿Qué quieres ahora, saco de carne?");
        }
    </script>
</body>
</html>
